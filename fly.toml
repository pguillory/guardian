# Fly.io configuration for Guardian. See "Fly.io" in README.md.
#
# This is the configuration of the maintainer's own deployment. To deploy your own copy,
# change `app` (globally unique) and `primary_region` (where the machine and its volume
# live), delete the overrides marked below, and adjust [[vm]] if the default does not
# fit.

app = "guardian-pguillory"
primary_region = "sjc"

# Guardian persists in-memory segments on SIGTERM, within a shutdown budget of about
# 110 s; keep kill_timeout above it. Fly's default SIGINT is not graceful.
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[deploy]
  # A volume attaches to one machine, so each machine is replaced in place.
  strategy = "rolling"
  max_unavailable = 1
  # No release_command: any machine running the image would join the cluster.

[env]
  GUARDIAN_DATA_DIR = "/data"

  # This deployment's overrides of Guardian's defaults; omit them for a new deploy.
  # They keep the maintainer's deployment behaving as it did before these settings
  # existed: the api_key query parameter stays accepted until web_requests.auth_method
  # shows nothing uses it, and the per-process query heap limit stays off.
  GUARDIAN_ALLOW_QUERY_API_KEY = "true"
  GUARDIAN_QUERY_MAX_HEAP_MB = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # A stopped machine's segments would vanish from query results.
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    # The server answers only after loading every segment on the volume, which takes
    # longer as data grows. Deploy with a matching --wait-timeout.
    grace_period = "10m"

[mounts]
  source = "guardian_data"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 14

[[restart]]
  policy = "always"

# One machine. Raise memory for bigger datasets: loaded segments are memory-mapped.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
