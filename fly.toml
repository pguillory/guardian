# Fly.io configuration for Guardian. See docs/guides/fly.md.
#
# This is the configuration of the maintainer's own deployment. To deploy your own copy,
# change `app` (globally unique) and `primary_region` (where the machine and its volume
# live), delete the overrides marked below, and adjust [[vm]] if the default does not
# fit.

app = "guardian-pguillory"
primary_region = "sjc"

# Guardian persists in-memory segments on SIGTERM, within a shutdown budget of about
# 110 s, after the tunnel connector (if any) drains for up to 10 s, 20 s at worst
# (bin/fly-start); keep kill_timeout above both. Fly's default SIGINT is not graceful.
kill_signal = "SIGTERM"
kill_timeout = 150

[build]
  dockerfile = "Dockerfile"

[deploy]
  # A volume attaches to one machine, so each machine is replaced in place.
  strategy = "rolling"
  max_unavailable = 1
  # No release_command: any machine running the image would join the cluster.

[env]
  GUARDIAN_DATA_DIR = "/data"

  # This deployment's override of Guardian's defaults; omit it for a new deploy.
  # It keeps the maintainer's deployment behaving as it did before the setting
  # existed: the per-process query heap limit stays off.
  GUARDIAN_QUERY_MAX_HEAP_MB = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # A stopped machine's segments would vanish from query results.
  auto_stop_machines = "off"
  auto_start_machines = true

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    # The server answers only after loading every segment on the volume, which takes
    # longer as data grows. Deploy with a matching --wait-timeout.
    grace_period = "10m"

[mounts]
  source = "guardian_data"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 14

[[restart]]
  policy = "always"

# One machine. Raise memory for bigger datasets: loaded segments are memory-mapped.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
